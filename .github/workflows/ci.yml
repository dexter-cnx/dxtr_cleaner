name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify
        run: make ci

  windows-gpui-spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test frontend-neutral core on Windows
        run: cargo test -p cleaner-core
      - name: Check Windows GPUI spike
        run: cargo check -p cleaner-gui-windows-spike
